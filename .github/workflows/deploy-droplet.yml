name: Deploy to Droplet

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: droplet
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HOST: ${{ secrets.DROPLET_IP }}
      TAG: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v7

      - name: Calcular dominio
        run: echo "DOMAIN=$(echo "$HOST" | tr . -).sslip.io" >> "$GITHUB_ENV"

      - name: Construir imagen
        run: docker build -t cafeteria:$TAG .

      - name: Configurar SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DROPLET_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts

      - name: Enviar imagen al Droplet
        run: docker save cafeteria:$TAG | gzip | ssh root@$HOST 'gunzip | docker load'

      - name: Reemplazar contenedores
        run: |
          ssh root@$HOST "
            set -e
            docker network inspect web >/dev/null 2>&1 || docker network create web
            docker rm -f cafeteria 2>/dev/null || true
            docker run -d --name cafeteria --network web --restart unless-stopped cafeteria:$TAG
            mkdir -p /opt/caddy
            printf '%s {\n  reverse_proxy cafeteria:80\n}\n' '$DOMAIN' > /opt/caddy/Caddyfile
            docker rm -f caddy 2>/dev/null || true
            docker run -d --name caddy --network web --restart unless-stopped \
              -p 80:80 -p 443:443 \
              -v /opt/caddy/Caddyfile:/etc/caddy/Caddyfile:ro \
              -v caddy_data:/data -v caddy_config:/config \
              caddy:2-alpine
            docker image prune -af
          "

      - name: Verificar HTTPS
        run: |
          for i in $(seq 1 30); do
            curl -fsS -o /dev/null "https://$DOMAIN/" && { echo "OK: https://$DOMAIN"; exit 0; }
            sleep 2
          done
          echo "No respondió https://$DOMAIN"
          exit 1
